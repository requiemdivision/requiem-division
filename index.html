<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title id="app-title">Requiem Division</title><meta id="app-vp" name="claude:viewport-fit-sides" content="cover"><link id="fonts" rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;500&amp;family=Barlow:wght@400;500&amp;family=IBM+Plex+Mono:wght@400&amp;display=swap"><style id="app-style">
/* Layout: slanted bands lifted from the cover art. Slim sticky header, banded section heads, chamfered content slots. */
:root{
  --ink:#0d1112;
  --panel:#151b1d;
  --slate:#222a2d;
  --rule:#34403f;
  --mist:#9ba5a6;
  --fg:#dfe4e3;
  --teal:#5ab8ae;
  --teal-deep:#0c3f41;
  --wave-off:#415054;
  --signal:#d4cc45;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
  background:var(--ink);
}
*{box-sizing:border-box}
body{background:var(--ink);color:var(--fg);font:400 16px/1.5 var(--f-body);-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--ink);z-index:30}
a{color:inherit}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--teal);outline-offset:2px}
.visually-hidden{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ico{display:inline-flex}
.wrap{width:100%;max-width:1280px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:rgba(13,17,18,.94);border-bottom:1px solid var(--rule)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px 24px;padding-block:8px}
.mark{display:flex;align-items:center;gap:12px;text-decoration:none;font:300 18px/1 var(--f-display);letter-spacing:.32em;text-transform:uppercase;color:var(--fg);white-space:nowrap}
.mark::before{content:"";width:18px;height:2px;background:var(--mist)}
.nav{display:flex;gap:2px}
.nav a{position:relative;isolation:isolate;display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:6px 18px;text-decoration:none;color:var(--mist);font-family:var(--f-display)}
.nav a::before{content:"";position:absolute;inset:0;background:var(--slate);transform:skewX(-14deg);opacity:0;transition:opacity .2s;z-index:-1}
.nav a:hover::before,.nav a[aria-current="page"]::before{opacity:1}
.nav a:hover{color:var(--fg)}
.nav a[aria-current="page"]{color:var(--teal)}
.nav .num{font:300 28px/1 var(--f-display);letter-spacing:.04em}
.nav .lbl{font:400 13px/1.2 var(--f-display);letter-spacing:.24em;text-transform:uppercase}
@media (max-width:640px){
  .top .wrap{flex-direction:column;align-items:stretch;gap:4px}
  .nav{display:grid;grid-template-columns:repeat(4,1fr)}
  .nav a{padding:6px 8px}
  .nav .num{font-size:24px}
  .nav .lbl{letter-spacing:.16em;font-size:12px}
}
@media (min-width:900px){body[data-tab="home"] .nav{display:none}}

/* home */
.home{display:flex;align-items:center;min-height:calc(100svh - 72px)}
.hero{position:relative;width:100%}
.hero img{display:block;width:100%;height:auto}
.hot{position:absolute;inset:0;display:block;clip-path:var(--poly)}
.hot::before{content:"";position:absolute;left:0;right:0;top:38.4%;height:21.3%;background:linear-gradient(to bottom,rgba(90,184,174,0),rgba(90,184,174,.3));opacity:0;transition:opacity .25s}
.hot::after{content:"";position:absolute;left:0;right:0;top:calc(59.7% - 3px);height:3px;background:var(--teal);opacity:0;transition:opacity .25s}
.hot:hover::before,.hot:hover::after,.hot:focus-visible::before,.hot:focus-visible::after{opacity:1}
.hot:focus-visible{outline:none}

/* section heads */
.vhead{position:relative;overflow:hidden;border-bottom:1px solid var(--rule)}
.vhead::before{content:"";position:absolute;top:0;bottom:0;right:-8%;width:46%;transform:skewX(-14deg);background:var(--band)}
.vhead .wrap{position:relative;display:flex;align-items:flex-end;flex-wrap:wrap;gap:12px 28px;padding-block:36px 26px}
.vnum{font:300 clamp(72px,14vw,168px)/.78 var(--f-display);letter-spacing:.02em;color:var(--teal)}
.vtitle{margin:0;font:300 clamp(28px,5vw,52px)/1 var(--f-display);letter-spacing:.26em;text-transform:uppercase}
.vdesc{margin:10px 0 0;color:var(--mist);max-width:46ch}
.vhead[data-view="visual"]{--band:linear-gradient(160deg,#0f3d3f,#092a2c)}
.vhead[data-view="audio"]{--band:linear-gradient(160deg,#2b3437,#1a2124)}
.vhead[data-view="store"]{--band:linear-gradient(160deg,#4b5456,#30393b)}
.vhead[data-view="contact"]{--band:repeating-linear-gradient(0deg,rgba(255,255,255,.08) 0 1px,transparent 1px 14px),repeating-linear-gradient(90deg,rgba(255,255,255,.08) 0 1px,transparent 1px 14px),#262d30}

/* media grids */
.hint-row{margin:22px 0 0;font:400 12px/1.6 var(--f-mono);color:var(--mist);letter-spacing:.02em}
.grid{display:grid;gap:20px;padding-block:24px 28px}
.grid.v{grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr))}
.grid.a{grid-template-columns:repeat(auto-fill,minmax(min(100%,460px),1fr))}
.none{margin:0;padding-block:72px;font:300 clamp(22px,4vw,32px)/1.2 var(--f-display);letter-spacing:.14em;text-transform:uppercase;color:var(--mist)}
.addrow{padding-bottom:64px}

.card{position:relative;min-width:0;display:flex;flex-direction:column;background:var(--panel);border:1px solid var(--rule);clip-path:polygon(0 0,calc(100% - 20px) 0,100% 20px,100% 100%,0 100%)}
.card::after{content:"";position:absolute;top:0;right:0;width:20px;height:20px;background:linear-gradient(to bottom left,transparent calc(50% - .5px),var(--rule) calc(50% - .5px),var(--rule) calc(50% + .5px),transparent calc(50% + .5px))}
.idx{font:400 12px/1 var(--f-mono);letter-spacing:.08em;color:var(--teal);white-space:nowrap}
.title{flex:1;min-width:0;margin:0;font:400 20px/1.2 var(--f-display);letter-spacing:.14em;text-transform:uppercase;overflow-wrap:anywhere}
.title-in{flex:1;min-width:0;width:100%;background:transparent;border:0;border-bottom:1px dashed var(--rule);padding:2px 0;font:400 20px/1.2 var(--f-display);letter-spacing:.14em;text-transform:uppercase}
.title-in:hover{border-bottom-color:var(--mist)}
.frame{aspect-ratio:16/9;max-width:100%;background:#000}
.frame video,.frame img{display:block;width:100%;height:100%;object-fit:contain;background:#000}
.zoom{position:relative;display:block;width:100%;height:100%;padding:0;border:0;background:#000;cursor:zoom-in}
.badge{position:absolute;right:10px;bottom:10px;padding:5px 9px;background:rgba(13,17,18,.88);border:1px solid var(--teal);color:var(--teal);font:400 11px/1 var(--f-mono);letter-spacing:.12em}
.strip{display:flex;gap:10px;overflow-x:auto;padding:12px 16px 10px;border-top:1px solid var(--rule)}
.tcell{position:relative;flex:none}
.thumb{display:block;width:76px;height:50px;padding:0;border:1px solid var(--rule);background:#000;cursor:zoom-in}
.thumb img{display:block;width:100%;height:100%;object-fit:cover}
.thumb:hover{border-color:var(--teal)}
.tx{position:absolute;top:-6px;right:-6px;width:20px;height:20px;padding:0;border:1px solid var(--rule);background:var(--ink);color:var(--fg);font-size:14px;line-height:1;cursor:pointer}
.tx:hover:not(:disabled){border-color:var(--signal);color:var(--signal)}
.gal .tools{padding-top:10px}
.lb{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(6,9,10,.95);padding:68px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.lb-img{display:block;max-width:100%;max-height:calc(100vh - 130px);max-height:calc(100dvh - 130px);object-fit:contain;border:1px solid var(--rule);background:#000}
.lb-close{position:absolute;top:max(12px,env(safe-area-inset-top,0px));right:max(12px,env(safe-area-inset-right,0px));display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:8px 16px;border:1px solid var(--teal);background:var(--teal-deep);color:var(--fg);cursor:pointer;font:500 13px/1 var(--f-display);letter-spacing:.2em;text-transform:uppercase}
.lb-close:hover{background:var(--teal);color:var(--ink)}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);display:grid;place-items:center;width:48px;height:64px;border:1px solid var(--rule);background:rgba(13,17,18,.82);color:var(--fg);cursor:pointer}
.lb-nav:hover{border-color:var(--teal);color:var(--teal)}
.lb-prev{left:max(8px,env(safe-area-inset-left,0px))}
.lb-next{right:max(8px,env(safe-area-inset-right,0px))}
.lb-count{position:absolute;left:0;right:0;bottom:max(18px,env(safe-area-inset-bottom,0px));text-align:center;font:400 12px/1 var(--f-mono);letter-spacing:.14em;color:var(--mist)}
.frame-err{margin:0;display:grid;place-items:center;height:100%;padding:16px;text-align:center;color:var(--mist);font:400 13px/1.5 var(--f-mono)}
.meta{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--rule)}
.tools{display:flex;gap:8px;flex-wrap:wrap;padding:0 16px 14px}
.status{display:block;padding:0 16px 12px;font:400 12px/1.5 var(--f-mono);color:var(--signal)}
.status:empty{display:none}

.a-head{display:flex;align-items:baseline;gap:12px;padding:16px 16px 8px}
.wave-wrap{padding:4px 16px}
.wave{display:block;width:100%;height:84px;cursor:pointer;touch-action:pan-y}
.a-ctl{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:8px 16px 14px}
.a-ctl .grow{flex:1}
.time{font:400 13px/1 var(--f-mono);color:var(--mist);font-variant-numeric:tabular-nums}
.vol{display:flex;align-items:center;gap:4px}
.vol-btn{display:grid;place-items:center;width:36px;height:36px;border:0;background:transparent;color:var(--mist);cursor:pointer;transition:color .2s}
.vol-btn:hover{color:var(--teal)}
.vol input{-webkit-appearance:none;appearance:none;width:96px;height:20px;margin:0;background:transparent;cursor:pointer}
.vol input::-webkit-slider-runnable-track{height:3px;background:linear-gradient(to right,var(--teal) var(--v,100%),var(--wave-off) var(--v,100%))}
.vol input::-moz-range-track{height:3px;background:var(--wave-off)}
.vol input::-moz-range-progress{height:3px;background:var(--teal)}
.vol input::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;margin-top:-4px;border:0;border-radius:0;background:var(--fg)}
.vol input::-moz-range-thumb{width:11px;height:11px;border:0;border-radius:0;background:var(--fg)}
.play{display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--teal);background:transparent;color:var(--teal);cursor:pointer;transition:background .2s,color .2s}
.play:hover:not(:disabled){background:var(--teal);color:var(--ink)}
.play:disabled{opacity:.5;cursor:progress}

.slot{position:relative;display:grid;place-content:center;justify-items:center;gap:10px;width:100%;min-height:200px;padding:28px 20px;border:1px dashed #475a5d;background:repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 12px,transparent 12px 24px);color:var(--mist);cursor:pointer;text-align:center;transition:border-color .2s,color .2s,background-color .2s}
.slot.v{min-height:0;aspect-ratio:16/9}
.slot .idx{position:absolute;top:12px;left:14px}
.slot:hover:not(:disabled),.slot.over,.slot:focus-visible{border-color:var(--teal);color:var(--fg);background-color:rgba(90,184,174,.07)}
.slot:disabled{cursor:progress}
.slot .big{font:300 26px/1 var(--f-display);letter-spacing:.22em;text-transform:uppercase}
.slot .hint{max-width:36ch;font:400 12px/1.5 var(--f-mono);letter-spacing:.02em}
.slot .err{color:var(--signal)}

/* buttons and fields */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:6px 14px;border:1px solid var(--rule);background:transparent;color:var(--fg);font:500 13px/1 var(--f-display);letter-spacing:.2em;text-transform:uppercase;text-decoration:none;cursor:pointer;transition:border-color .2s,background .2s,color .2s}
.btn:hover:not(:disabled){border-color:var(--teal);color:var(--teal)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--teal);border-color:var(--teal);color:#06201f}
.btn.primary:hover:not(:disabled){background:#7fd0c7;border-color:#7fd0c7;color:#06201f}
.btn.danger:hover:not(:disabled){border-color:var(--signal);color:var(--signal)}
.field{width:100%;min-width:0;background:var(--panel);border:1px solid var(--rule);padding:8px 12px;font:300 clamp(22px,4vw,40px)/1.2 var(--f-display);letter-spacing:.05em}
.field::placeholder{color:#5d6b6e}

/* publish bar */
.pub{position:fixed;left:0;right:0;bottom:0;z-index:25;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px 16px;background:var(--teal-deep);border-top:1px solid var(--teal);padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.pub-msg{font:400 13px/1.4 var(--f-mono)}
body.has-bar main{padding-bottom:96px}

/* store */
.soon{display:grid;justify-items:center;gap:28px;padding-block:clamp(72px,16vh,150px) clamp(88px,18vh,170px);text-align:center}
.soon .dash{width:44px;height:3px;background:var(--mist)}
.soon h2{margin:0;padding-left:.2em;font:300 clamp(40px,11vw,128px)/1 var(--f-display);letter-spacing:.2em;text-transform:uppercase}

/* contact */
.rows{padding-block:24px 64px}
.row{display:grid;grid-template-columns:minmax(110px,170px) minmax(0,1fr) auto;align-items:center;gap:12px 24px;padding-block:28px;border-top:1px solid var(--rule)}
.row:last-child{border-bottom:1px solid var(--rule)}
.row .k{font:400 12px/1 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--mist)}
.row .v{margin:0;font:300 clamp(24px,5.4vw,52px)/1.1 var(--f-display);letter-spacing:.05em;overflow-wrap:anywhere;user-select:all}
.row .acts{display:flex;gap:8px;flex-wrap:wrap}
@media (max-width:700px){.row{grid-template-columns:minmax(0,1fr)}}

    var rec;
    if(kind==="video"){
      setBusy(kind,i,"Uploading "+mb(file.size));
      var img=isImg(file);var res=await assetsApi.upload(file,{type:img?imime(file):vmime(file)});
      rec={id:res.id,url:res.url,title:cleanName(file.name),size:file.size,type:img?"image":"video"};
    }else{
      setBusy(kind,i,"Reading waveform");
      var info=await analyse(file);
      setBusy(kind,i,"Uploading "+mb(file.size));
      var b64=await toB64(file);
      if(b64.length>B64_MAX) throw {user:file.name+" is too large for audio storage. Export it as MP3 or M4A."};
      var r2=await assetsApi.upload(new Blob([b64],{type:"text/plain"}),{type:"text/plain"});
      rec={id:r2.id,title:cleanName(file.name),size:file.size,mime:amime(file),dur:info.dur,peaks:info.peaks,local:URL.createObjectURL(file)};
    }
    S[kind][i]=rec;
    delete msgs[k];
    markDirty();
  }catch(e){
    msgs[k]=errText(e);
  }finally{
    delete busy[k];
    refreshSlot(kind,i);
  }
}

function removeBtn(kind,i,disabled){

function replaceBtn(kind,i,disabled){

function titleEl(kind,i,it,onTitle){

function imgSrc(x){return mediaUrl(x.id);}
function imgsOf(it){return it.imgs&&it.imgs.length?it.imgs:[{id:it.id,url:it.url,size:it.size||0}];}

  if(!l.length){S.video[i]=null;}else{it.imgs=l;it.id=l[0].id;it.url=l[0].url;}
  markDirty();refreshSlot("video",i);

function thumbStrip(i,it,list,b){
  if(list.length<2&&!edit) return null;
  var wrap=el("div",{class:"gal"});
  if(list.length>1){
    var strip=el("div",{class:"strip"});
    list.forEach(function(x,n){
      var t=el("img",{alt:"",loading:"lazy"});t.src=imgSrc(x);
      var cell=el("div",{class:"tcell"},el("button",{type:"button",class:"thumb","aria-label":"Open image "+(n+1)+" of "+list.length,onclick:function(){openLightbox(list,n,it.title);}},t));
      if(edit) cell.append(el("button",{type:"button",class:"tx","aria-label":"Remove image "+(n+1),text:"×",disabled:b?true:null,onclick:function(){removeImg(i,it,n);}}));
      strip.append(cell);
    });
    wrap.append(strip);
  }
  if(edit) wrap.append(el("div",{class:"tools"},el("button",{type:"button",class:"btn",text:"Add images",disabled:b?true:null,onclick:function(){pick("video",i,false,"append");}})));
  return wrap;
}
function openLightbox(list,start,title){
  var idx=start||0,prevFocus=document.activeElement,prevOverflow=document.body.style.overflow;
  var ov=el("div",{class:"lb",role:"dialog","aria-modal":"true","aria-label":(title||"Image")+" viewer"});
  var img=el("img",{class:"lb-img",alt:""});
  var count=el("div",{class:"lb-count","aria-live":"polite"});
  var closeBtn=el("button",{type:"button",class:"lb-close","aria-label":"Close image viewer"},icon("x"),"Close");
  var focusable=[closeBtn];
  ov.append(img,count,closeBtn);
  function show(){img.src=imgSrc(list[idx]);img.alt=(title||"Image")+" "+(idx+1)+" of "+list.length;count.textContent=list.length>1?(idx+1)+" / "+list.length:"";}
  function step(d){idx=(idx+d+list.length)%list.length;show();}
  function close(){document.removeEventListener("keydown",onKey,true);ov.remove();document.body.style.overflow=prevOverflow;try{if(prevFocus&&prevFocus.focus) prevFocus.focus();}catch(e){}}
  function onKey(e){
    if(e.key==="Escape"){e.preventDefault();e.stopPropagation();close();}
    else if(list.length>1&&e.key==="ArrowRight"){e.preventDefault();step(1);}
    else if(list.length>1&&e.key==="ArrowLeft"){e.preventDefault();step(-1);}
    else if(e.key==="Tab"){
      e.preventDefault();
      var at=focusable.indexOf(document.activeElement);
      var nx=(at+(e.shiftKey?-1:1)+focusable.length)%focusable.length;
      focusable[nx].focus();
    }
  }
  if(list.length>1){
    var pb=el("button",{type:"button",class:"lb-nav lb-prev","aria-label":"Previous image",onclick:function(){step(-1);}},icon("chevL"));
    var nb=el("button",{type:"button",class:"lb-nav lb-next","aria-label":"Next image",onclick:function(){step(1);}},icon("chevR"));
    ov.append(pb,nb);focusable.push(pb,nb);
  }
  closeBtn.addEventListener("click",close);
  ov.addEventListener("click",function(e){if(e.target===ov) close();});
  var tx0=null;
  ov.addEventListener("touchstart",function(e){tx0=e.touches.length===1?e.touches[0].clientX:null;},{passive:true});
  ov.addEventListener("touchend",function(e){
    if(tx0==null||list.length<2) return;
    var dx=e.changedTouches[0].clientX-tx0;tx0=null;
    if(Math.abs(dx)>50) step(dx<0?1:-1);
  },{passive:true});
  document.body.style.overflow="hidden";
  document.body.append(ov);
  document.addEventListener("keydown",onKey,true);
  show();
  closeBtn.focus();
}

function imageCard(i,it){
  var k=key("video",i);
  var img=el("img",{alt:it.title||"Image",loading:"lazy"});
  var list=imgsOf(it);
  var zoom=el("button",{type:"button",class:"zoom","aria-label":"View "+(it.title||"image")+(list.length>1?" and "+(list.length-1)+" more":"")+" larger",onclick:function(){openLightbox(list,0,it.title);}},img);
  if(list.length>1) zoom.append(el("span",{class:"badge",text:list.length+" IMAGES"}));
  var frame=el("div",{class:"frame"},zoom);
  img.src=imgSrc(list[0]);
  img.addEventListener("error",function(){frame.replaceChildren(el("p",{class:"frame-err",text:"This image can't be shown. The file may have been removed."}));});
  var b=!!busy[k];
  return el("article",{class:"card v"},
    frame,
    el("div",{class:"meta"},el("span",{class:"idx",text:"V"+pad(i+1)}),titleEl("video",i,it,function(v){img.alt=v;})),
    thumbStrip(i,it,list,b),
    edit?el("div",{class:"tools"},replaceBtn("video",i,b),removeBtn("video",i,b)):null,
    el("span",{class:"status",role:"status",text:busy[k]||msgs[k]||""})
  );
}

function videoCard(i,it){

function audioCard(i,it){
  var k=key("audio",i);
  var audio=new Audio();audio.preload="none";
  var ready=false,loading=false,pending=null;
  var canvas=el("canvas",{class:"wave",role:"slider",tabindex:"0","aria-label":"Seek in "+(it.title||"track"),"aria-valuemin":"0","aria-valuemax":"100","aria-valuenow":"0"});
  canvas._peaks=it.peaks&&it.peaks.length?it.peaks:FLAT;canvas._ratio=0;
  var playBtn=el("button",{type:"button",class:"play","aria-label":"Play"});
  playBtn.append(icon("play"));
  var time=el("span",{class:"time",text:"0:00 / "+fmt(it.dur)});
  var vol=el("input",{type:"range",min:"0",max:"100",step:"1",value:"100",id:"vol-"+i,"aria-label":"Volume for "+(it.title||"track")});
  var volBtn=el("button",{type:"button",class:"vol-btn","aria-label":"Mute"});
  var lastVol=100;
  function setVol(v){
    v=Math.max(0,Math.min(100,v));
    audio.volume=v/100;vol.value=String(v);vol.style.setProperty("--v",v+"%");
    vol.setAttribute("aria-valuetext",v+"%");
    volBtn.replaceChildren(icon(v===0?"mute":"spk"));
    volBtn.setAttribute("aria-label",v===0?"Unmute":"Mute");
  }
  vol.addEventListener("input",function(){var v=+vol.value;if(v>0)lastVol=v;setVol(v);});
  volBtn.addEventListener("click",function(){if(+vol.value>0){lastVol=+vol.value;setVol(0);}else setVol(lastVol||100);});
  setVol(100);
  var status=el("span",{class:"status",role:"status",text:busy[k]||msgs[k]||""});
  function dur(){var d=audio.duration;return isFinite(d)&&d>0?d:(it.dur||0);}
  function sync(){
    var d=dur(),r=pending!=null?pending:(d?audio.currentTime/d:0);
    canvas._ratio=clamp(r);drawWave(canvas);
    time.textContent=fmt(pending!=null?pending*d:audio.currentTime)+" / "+fmt(d);
    canvas.setAttribute("aria-valuenow",String(Math.round(clamp(r)*100)));
  }
  var raf=0;
  function loop(){sync();if(!audio.paused) raf=requestAnimationFrame(loop);}
  function applyPending(){
    if(pending==null) return;
    var d=dur();
    if(d) audio.currentTime=pending*d;
    pending=null;sync();
  }
  async function ensure(){
    if(ready) return true;
    if(it.local){audio.src=it.local;ready=true;return true;}
    if(loading) return false;
    loading=true;status.textContent="Loading audio";playBtn.disabled=true;
    try{
      var res=await fetch(srcOf(it));
      if(!res.ok) throw new Error("http "+res.status);
      var text=(await res.text()).trim();
      var bin=atob(text),bytes=new Uint8Array(bin.length);
      for(var n=0;n<bin.length;n++) bytes[n]=bin.charCodeAt(n);
      audio.src=URL.createObjectURL(new Blob([bytes],{type:it.mime||"audio/mpeg"}));
      ready=true;status.textContent="";
      return true;
    }catch(e){
      status.textContent="This track can't be loaded right now.";
      return false;
    }finally{loading=false;playBtn.disabled=false;}
  }
  function toggle(){
    if(!audio.paused){audio.pause();return;}
    if(ready) audio.play().catch(function(){});
    else ensure().then(function(ok){if(ok) audio.play().catch(function(){});});
  }
  function seekTo(r){
    r=clamp(r);
    if(ready){
      var d=dur();
      if(d){audio.currentTime=r*d;pending=null;}else pending=r;
      sync();
    }else{
      pending=r;sync();
      ensure();
    }
  }
  audio.addEventListener("loadedmetadata",function(){applyPending();sync();});
  audio.addEventListener("play",function(){
    pauseOthers(audio);
    playBtn.replaceChildren(icon("pause"));playBtn.setAttribute("aria-label","Pause");
    cancelAnimationFrame(raf);loop();
  });
  audio.addEventListener("pause",function(){
    playBtn.replaceChildren(icon("play"));playBtn.setAttribute("aria-label","Play");
    sync();
  });
  audio.addEventListener("ended",function(){audio.currentTime=0;sync();});
  audio.addEventListener("error",function(){if(audio.src) status.textContent="This track can't be played in this browser.";});
  playBtn.addEventListener("click",toggle);

  var drag=false;
  function fromEvent(e){var r=canvas.getBoundingClientRect();seekTo((e.clientX-r.left)/r.width);}
  canvas.addEventListener("pointerdown",function(e){drag=true;try{canvas.setPointerCapture(e.pointerId);}catch(x){}fromEvent(e);});
  canvas.addEventListener("pointermove",function(e){if(drag) fromEvent(e);});
  canvas.addEventListener("pointerup",function(){drag=false;});
  canvas.addEventListener("pointercancel",function(){drag=false;});
  canvas.addEventListener("keydown",function(e){
    if(e.key===" "||e.key==="Enter"){e.preventDefault();toggle();}
    else if((e.key==="ArrowLeft"||e.key==="ArrowRight")&&dur()){
      e.preventDefault();
      var cur=pending!=null?pending*dur():audio.currentTime;
      seekTo((cur+(e.key==="ArrowRight"?5:-5))/dur());
    }
  });
  players.push(audio);

  var b=!!busy[k];
  var card=el("article",{class:"card a"},
    el("div",{class:"a-head"},el("span",{class:"idx",text:"A"+pad(i+1)}),titleEl("audio",i,it,function(v){canvas.setAttribute("aria-label","Seek in "+v);vol.setAttribute("aria-label","Volume for "+v);})),
    el("div",{class:"wave-wrap"},canvas),
    el("div",{class:"a-ctl"},playBtn,time,el("span",{class:"grow"}),el("div",{class:"vol"},volBtn,vol),edit?[replaceBtn("audio",i,b),removeBtn("audio",i,b)]:null),
    status
  );
  ro.observe(canvas);
  return card;
}

/* ---------- saving ---------- */
function markDirty(){dirty=true;updateBar();updateHint();}
function serialize(){
  function clean(kind,it){
    if(!it) return null;
    var o={id:it.id,title:it.title||"",size:it.size||0};if(kind==="video"&&it.type==="image"){o.type="image";o.imgs=imgsOf(it).map(function(x){return {id:x.id,size:x.size||0};});o.id=o.imgs[0].id;}
    if(kind==="audio"){o.mime=it.mime||"audio/mpeg";o.dur=it.dur||0;o.peaks=it.peaks&&it.peaks.length?it.peaks:null;}
    return o;
  }
  return {v:1,video:S.video.map(function(x){return clean("video",x);}),audio:S.audio.map(function(x){return clean("audio",x);}),instagram:handleOf(S.instagram)};
}
function buildDoc(){
  var parts=["app-title","app-vp","fonts","app-style"].map(function(id){return document.getElementById(id).outerHTML;}).join("");
  var st=JSON.stringify(serialize()).replace(/</g,"\\u003c");
  var head='<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>';
  return head+parts+'<div id="app"></div><scr'+'ipt type="application/json" id="state">'+st+'</scr'+'ipt>'+document.getElementById("hero-src").outerHTML+document.getElementById("app-script").outerHTML+'</body></html>';
}
function pubErr(e){
  switch(e&&e.code){
    case "conflict":return "Someone published a newer version first. The page is reloading. Add your change again.";
    case "not_writer":case "not_granted":case "consent_required":return "This account can't publish. Editor access is needed.";
    case "too_large":return "The page is too large to publish. Remove some items.";
    case "rate_limited":return "Publishing too often. Wait a moment and try again.";
    default:return "Publishing failed. Try again.";
  }
}
function updateBar(){
  barHost.replaceChildren();
  var show=edit&&dirty;
  document.body.classList.toggle("has-bar",show);
  if(!show) return;
  var msg=el("span",{class:"pub-msg",role:"status",text:"You have changes visitors can't see yet."});
  var btn=el("button",{type:"button",class:"btn primary",id:"publish-btn",text:"Publish changes"});
  btn.addEventListener("click",async function(){
    if(Object.keys(busy).length){msg.textContent="Wait for uploads to finish first.";return;}
    btn.disabled=true;msg.textContent="Publishing. The page will reload.";
    try{await artifactApi.publish(buildDoc());}
    catch(e){btn.disabled=false;msg.textContent=pubErr(e);}
  });
  barHost.append(el("div",{class:"pub"},msg,btn));
}
